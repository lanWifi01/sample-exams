<style>
:root{color-scheme:light;--paper:#fff;--background:#f1f4f5;--ink:#152b37;--muted:#475d67;--line:#cad7dd;--accent:#18536b;--correct:#1b623d;--wrong:#942d22;font-family:Inter,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--ink);font-size:.94rem;line-height:1.45}
main{max-width:1120px;margin:auto;padding:1.1rem clamp(.65rem,3vw,1.5rem) 2rem}
h1{font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.12;margin:0 0 .85rem}
h2{font-size:1.15rem;margin:0}
p{margin:0}
section{margin-top:1.5rem;scroll-margin-top:1rem}
.intro,.card,details,.table-wrap{background:var(--paper);border:1px solid var(--line);border-radius:.55rem}
.intro{padding:1rem;border-top:.3rem solid var(--accent)}
.meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem;margin-bottom:.65rem}
.meta label{font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:.35rem .8rem;margin-top:.7rem}
nav a{color:var(--accent);text-underline-offset:.17em}
.section-header{display:flex;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.count,.directions{color:var(--muted)}
.count{font-size:.82rem;white-space:nowrap}
.directions{margin:0 0 .5rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:.5rem}
.card{padding:.62rem .7rem;min-width:0;margin:0}
.card legend{padding:0 .15rem;font-weight:650;max-width:100%}
.options,.fields{display:grid;gap:.25rem .4rem;margin:.15rem 0 .35rem}
.options{grid-template-columns:repeat(2,minmax(0,1fr))}
.options label{display:flex;gap:.3rem;align-items:baseline;padding:.18rem .22rem;border-radius:.25rem;cursor:pointer}
.options label:hover{background:#eef5f7}
.options input{margin:0;accent-color:var(--accent);flex:none}
.fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.fields label{display:grid;gap:.12rem}
input:not([type=radio]),textarea{width:100%;border:1px solid var(--line);border-radius:.3rem;padding:.35rem .45rem;font:inherit;color:inherit;background:var(--paper)}
textarea{resize:vertical;min-height:3.35rem}
.single{display:block;margin:.22rem 0 .4rem}
button{font:inherit;font-weight:650;border:1px solid var(--accent);border-radius:.3rem;background:var(--paper);color:var(--accent);padding:.24rem .55rem;cursor:pointer}
button:hover{background:#e9f4f7}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.feedback{margin:.35rem 0 0;color:var(--muted)}
.feedback[data-status=correct]{color:var(--correct)}
.feedback[data-status=wrong]{color:var(--wrong)}
.feedback:empty{display:none}
.table-wrap{overflow-x:auto;margin:.5rem 0}
table{width:100%;min-width:540px;border-collapse:collapse}
caption{text-align:left;padding:.45rem .7rem;font-weight:700}
th,td{padding:.26rem .7rem;border-bottom:1px solid var(--line);text-align:left}
td:not(:first-child),thead th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
thead,.group{background:#e9f1f4}
tfoot td,tbody:last-child tr:last-child td,tbody:last-child tr:last-child th{border-bottom:0}
tbody th{font-weight:500}
.group th{font-size:.79rem;font-weight:700}
details{margin:.65rem 0;padding:.48rem .65rem}
details summary{color:var(--accent);font-weight:650;cursor:pointer}
details[open] summary{margin-bottom:.45rem}
pre{white-space:pre-wrap;font:inherit;margin:0}
@media(max-width:700px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:390px){.options{grid-template-columns:1fr}}
</style>
</head>

<script>
"use strict";

const exam = JSON.parse(document.getElementById("exam-data").textContent);
const container = document.getElementById("exam");
const navigation = document.getElementById("navigation");
const score = document.getElementById("score");
const letters = ["A", "B", "C", "D"];
const points = new Map();

function element(tag, content, attributes = {}) {
  const node = document.createElement(tag);
  if (content !== undefined) node.textContent = content;
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  return node;
}

function addSection(slug, title, count, instructions) {
  const section = element("section", undefined, { id: slug });
  const heading = element("div", undefined, { class: "section-header" });
  heading.append(element("h2", title), element("span", count + " items", { class: "count" }));
  section.append(heading);
  if (instructions) section.append(element("p", instructions, { class: "directions" }));
  container.append(section);
  navigation.append(element("a", title.replace(/^[IVX]+ /, ""), { href: "#" + slug }));
  return section;
}

function labelField(caption, input, className) {
  const label = element("label", caption, className ? { class: className } : {});
  label.append(input);
  return label;
}

function makeTextField(caption, mode = "text") {
  return labelField(caption, element("input", undefined, {
    type: "text", inputmode: mode, autocomplete: "off"
  }), "single");
}

function makeWorkField(caption) {
  return labelField(caption, element("textarea", undefined, { rows: "2" }), "single");
}

function makeOptions(id, choices) {
  const group = element("div", undefined, { class: "options" });
  choices.forEach(([value, caption]) => {
    const input = element("input", undefined, { type: "radio", name: id, value });
    const label = element("label");
    label.append(input, element("span", caption));
    group.append(label);
  });
  return group;
}

function normalize(value) {
  return value.toLowerCase().normalize("NFKC")
    .replace(/[^\p{L}\p{N}]+/gu, " ").trim();
}

function readNumber(value) {
  const clean = value.trim().replace(/^₱\s*/, "").replace(/%\s*$/, "").trim();
  if (!/^-?(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d+)?$/.test(clean)) return NaN;
  return Number(clean.replace(/,/g, ""));
}

function gradeList(values, accepted) {
  const unmatched = accepted.map(group => group.map(normalize));
  let matches = 0;
  for (const entry of values.map(normalize).filter(Boolean)) {
    const index = unmatched.findIndex(group => group.includes(entry));
    if (index >= 0) {
      matches++;
      unmatched.splice(index, 1);
    }
  }
  return matches;
}

function renderQuestion(item, id, scored = true) {
  const card = element("fieldset", undefined, { class: "card" });
  card.append(element("legend", (item.n ? item.n + ". " : "") + item.q));
  if (item.type === "choice") {
    card.append(makeOptions(id, item.options.map((choice, i) => [letters[i], letters[i].toLowerCase() + ") " + choice])));
  } else if (item.type === "truth" || item.type === "class") {
    const options = item.type === "truth" ? ["TRUE", "FALSE"] : ["ASSET", "LIABILITY"];
    card.append(makeOptions(id, options.map(option => [option, option])), makeWorkField("Short explanation"));
  } else if (item.type === "list") {
    const fields = element("div", undefined, { class: "fields" });
    item.answer.forEach((_, i) => fields.append(makeTextField("Answer " + (i + 1))));
    card.append(fields);
  } else if (item.type === "math") {
    card.append(makeWorkField("Formula and substitution"), makeTextField("Final answer", "decimal"));
  } else {
    card.append(makeTextField("Answer", item.type === "budget" ? "decimal" : "text"));
  }

  const feedback = element("p", undefined, { class: "feedback", role: "status", "aria-live": "polite" });
  const button = element("button", "Check answer", { type: "button" });
  const answerFields = [...card.querySelectorAll("input")];

  function check() {
    const values = answerFields.filter(input => input.type !== "radio" || input.checked).map(input => input.value.trim());
    const hasAnswer = values.some(Boolean);

    const possible = item.type === "list" ? item.answer.length : 1;
    let earned;
    let model;
    if (item.type === "list") {
      earned = gradeList(values, item.answer);
      model = item.answer.map(group => group[0]).join("; ") + ".";
    } else if (item.type === "term") {
      earned = Number(item.answer.some(term => normalize(term) === normalize(values[0])));
      model = item.answer.join(" or ") + ".";
    } else if (item.type === "math" || item.type === "budget") {
      earned = Number(Math.abs(readNumber(values[0]) - item.answer) < 0.000001);
      model = item.note;
    } else {
      earned = Number(values[0] === item.answer);
      const solution = item.type === "choice" ? item.answer + ") " + item.options[letters.indexOf(item.answer)] : item.answer;
      model = solution + (/[.!?]$/.test(solution) ? " " : ". ") + item.note;
    }

    if (!hasAnswer) {
      delete feedback.dataset.status;
      feedback.textContent = "Answer: " + model;
      return;
    }

    feedback.dataset.status = earned === possible ? "correct" : "wrong";
    const result = item.type === "list" ? earned + " of " + possible + " correct." : earned ? "Correct." : "Incorrect.";
    const compare = card.querySelector("textarea") ? " Compare your written work with the explanation." : "";
    feedback.textContent = result + " " + model + compare;
    if (scored) {
      points.set(id, earned);
      updateScore();
    }
  }

  function clearResult() {
    feedback.textContent = "";
    delete feedback.dataset.status;
    if (scored && points.delete(id)) updateScore();
  }

  button.addEventListener("click", check);
  answerFields.forEach(input => {
    input.addEventListener(input.type === "radio" ? "change" : "input", clearResult);
    if (input.type !== "radio") {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") check();
      });
    }
  });
  card.append(button, feedback);
  return card;
}

function updateScore() {
  score.value = [...points.values()].reduce((sum, value) => sum + value, 0) + " / 80";
}

function renderGrid(target, items, slug, scored = true) {
  const grid = element("div", undefined, { class: "grid" });
  items.forEach((item, i) => grid.append(renderQuestion(item, slug + "-" + i, scored)));
  target.append(grid);
}

function renderAllocation() {
  const section = addSection("allocation-plan", "VI ALLOCATION PLAN", 15,
    "Complete the five missing totals for each month. Enter a peso amount for each item.");
  const table = element("table");
  table.append(element("caption", "Allocation worksheet"));
  const head = element("thead");
  const headers = element("tr");
  ["Category", "Month 1", "Month 2", "Month 3"].forEach(label => headers.append(element("th", label, { scope: "col" })));
  head.append(headers);
  table.append(head);
  let group;
  const questions = [];
  exam.budgetRows.forEach(([label, ...amounts]) => {
    const row = element("tr");
    if (!amounts.length) {
      group = element("tbody");
      table.append(group);
      row.className = "group";
      row.append(element("th", label, { colspan: "4", scope: "rowgroup" }));
    } else {
      row.append(element("th", label, { scope: "row" }));
      const notes = exam.budgetNotes[label];
      amounts.forEach((amount, i) => {
        if (notes) {
          const number = questions.length + 1;
          questions.push({ n: number, q: label + " — Month " + (i + 1), type: "budget",
            answer: readNumber(amount), note: Array.isArray(notes) ? notes[i] : notes });
          const cell = element("td");
          cell.append(element("a", "Item " + number, { href: "#allocation-" + number }));
          row.append(cell);
        } else {
          row.append(element("td", amount));
        }
      });
    }
    group.append(row);
  });

  const wrapper = element("div", undefined, { class: "table-wrap" });
  wrapper.append(table);
  section.append(wrapper);
  const grid = element("div", undefined, { class: "grid" });
  questions.forEach(item => {
    const id = "allocation-" + item.n;
    const card = renderQuestion(item, id);
    card.id = id;
    card.tabIndex = -1;
    grid.append(card);
  });
  section.append(grid);

  const model = element("details");
  model.append(element("summary", "Completed allocation plan and short explanation"));
  const original = table.cloneNode(true);
  original.querySelector("caption").textContent = "Completed allocation plan";
  original.querySelectorAll("tbody tr").forEach((row, i) => {
    const [, ...amounts] = exam.budgetRows[i];
    row.querySelectorAll("td").forEach((cell, month) => { cell.textContent = amounts[month]; });
  });
  const originalWrapper = element("div", undefined, { class: "table-wrap" });
  originalWrapper.append(original);
  model.append(originalWrapper, element("strong", "Short Explanation"), element("p", exam.budgetExplanation));
  section.append(model);
}

document.getElementById("general").textContent = exam.general;
for (const section of exam.sections) {
  const target = addSection(section.slug, section.title, section.count, section.instructions);
  renderGrid(target, section.items, section.slug);
  if (section.slug === "true-or-false") {
    const extra = element("details");
    extra.append(element("summary", "2 extra True or False items from the PDF"));
    renderGrid(extra, exam.extras, "extra-true-or-false", false);
    target.append(extra);
  }
}
renderAllocation();

const key = element("details");
key.append(element("summary", "Answer Key"), element("pre", exam.answerKey));
container.append(key);
</script>
